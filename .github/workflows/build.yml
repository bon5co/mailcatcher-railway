name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      MAILCATCHER_VERSION: 1.7.0
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            MAILCATCHER_VERSION=${{ env.MAILCATCHER_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mailcatcher:${{ env.MAILCATCHER_VERSION }}
            ghcr.io/${{ github.repository_owner }}/mailcatcher:latest
